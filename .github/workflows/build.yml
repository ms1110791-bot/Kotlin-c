name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts नहीं मिली - फाइलें repo में upload हुईं?"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsHub-debug
          path: "**/build/outputs/apk/debug/*.apk"
